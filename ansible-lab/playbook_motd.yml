- name: Change Message of the Day with dynamic info
  hosts: all
  become: yes
  vars:
    # Можно задать дополнительное пожелание
    greeting: "Have a nice day, sysadmin!"

  tasks:
    - name: Compose MOTD content using facts
      ansible.builtin.set_fact:
        motd_content: |
          Hostname: {{ ansible_hostname }}
          IP Address: {{ ansible_default_ipv4.address }}
          {{ greeting }}

    - name: Set MOTD file
      ansible.builtin.copy:
        dest: /etc/motd
        content: "{{ motd_content }}\n"
        mode: '0644'